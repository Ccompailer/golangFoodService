server:
  port: "8080"
  environment: "develop"
  read_timeout: 10
  write_timeout: 10

auth:
  jwks_url: "https://my-service/auth.internal.com"
  issuer: "https://my-service/auth.internal.com"
  audience: "api-gateway"
  skew: 30
  refresh_min: 5

redis:
  host: "localhost"
  port: "6379"
  password: "password"
  db: ""

service:
  user_service: "user-service:50051"
  catalog_service: "catalog-service:50052"
  order_service: "order-service:50053"
  payment_service: "payment-service:50054"

log:
  level: "info"